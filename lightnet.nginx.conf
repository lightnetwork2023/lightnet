server {
    server_name lightnet.lightnetwork.pro;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for web app
        add_header Access-Control-Allow-Origin "https://lightnet-d2de9.web.app" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lightnet.lightnetwork.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lightnet.lightnetwork.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = lightnet.lightnetwork.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name lightnet.lightnetwork.pro;
    return 404; # managed by Certbot
}
